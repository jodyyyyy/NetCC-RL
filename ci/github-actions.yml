name: CPU checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: python -m pip install --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple "torch==2.4.0+cpu"
      - run: python -m pip install ".[baselines,test]"
      - run: python -m netcc_rl.catalog --validate > "$RUNNER_TEMP/matrix.json"
      - run: python -m pytest -q
        env:
          CUDA_VISIBLE_DEVICES: ""
          OMP_NUM_THREADS: "1"
      - run: |
          python -m netcc_rl.train --config configs/ablation/sis/E0.yaml --smoke --output "$RUNNER_TEMP/smoke"
          python -m netcc_rl.evaluate --config configs/ablation/sis/E0.yaml --checkpoint "$RUNNER_TEMP/smoke/final.pt" --episodes 1
